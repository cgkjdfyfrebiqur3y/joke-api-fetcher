<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Joke API Fetcher — Test UI</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 40px auto;
        padding: 0 16px;
        color: #1a1a1a;
      }
      h1 { font-size: 22px; }
      label { display: block; margin: 16px 0 4px; font-weight: 600; }
      input, button, select { font-size: 16px; padding: 8px; }
      input, select { width: 100%; box-sizing: border-box; }
      button {
        margin-top: 16px;
        cursor: pointer;
        background: #2563eb;
        color: #fff;
        border: 0;
        border-radius: 6px;
        padding: 10px 18px;
      }
      #result {
        margin-top: 24px;
        padding: 16px;
        border-radius: 8px;
        background: #f3f4f6;
        min-height: 40px;
        white-space: pre-wrap;
      }
      #status { font-weight: 700; }
      .ok { color: #15803d; }
      .err { color: #b91c1c; }
    </style>
  </head>
  <body>
    <h1>Joke API Fetcher</h1>
    <p>
      Calls the local server's <code>/joke</code> endpoint. The external
      JokeAPI v2 dependency is stubbed by the test harness.
    </p>

    <label for="token">Auth token</label>
    <input id="token" value="validtoken123" />

    <button id="getJoke">Get Joke</button>

    <div id="result">
      <div id="status">Ready</div>
      <div id="joke"></div>
    </div>

    <script>
      const btn = document.getElementById("getJoke");
      const statusEl = document.getElementById("status");
      const jokeEl = document.getElementById("joke");

      btn.addEventListener("click", async () => {
        statusEl.textContent = "Loading...";
        statusEl.className = "";
        jokeEl.textContent = "";
        const token = document.getElementById("token").value.trim();
        try {
          const res = await fetch("/joke", {
            headers: token ? { Authorization: "Bearer " + token } : {},
          });
          const data = await res.json();
          if (res.ok && data.error === false) {
            statusEl.textContent = "Success (HTTP " + res.status + ")";
            statusEl.className = "ok";
            jokeEl.textContent = data.joke;
          } else {
            statusEl.textContent = "Error (HTTP " + res.status + ")";
            statusEl.className = "err";
            jokeEl.textContent = data.message || JSON.stringify(data);
          }
        } catch (e) {
          statusEl.textContent = "Request failed";
          statusEl.className = "err";
          jokeEl.textContent = String(e);
        }
      });
    </script>
  </body>
</html>
