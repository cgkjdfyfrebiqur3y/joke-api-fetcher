[project]
name = "joke-api-fetcher"
version = "0.0.1"
authors = [
  { name="Example Author", email="author@example.com" },
]
description = "An interface to JokeAPI"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/cgkjdfyfrebiqur3y/joke-api-fetcher"
Issues = "https://github.com/cgkjdfyfrebiqur3y/joke-api-fetcher/issues"

[build-system]
requires = ["setuptools >= 77.0.3","requests"]
build-backend = "setuptools.build_meta"