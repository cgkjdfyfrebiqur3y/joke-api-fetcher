name: Publish Python 🐍 distribution 📦 to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  check-tag:
    name: Check tag
    runs-on: ubuntu-latest

    outputs:
      publish: ${{ steps.check.outputs.publish }}

    steps:
      - name: Check whether this is a pre-release
        id: check
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ "$TAG" =~ (alpha|beta|rc)$ ]]; then
            echo "Skipping pre-release tag: $TAG"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build distribution 📦
    needs: check-tag
    if: needs.check-tag.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install pypa/build
        run: python3 -m pip install --user build

      - name: Build distribution
        run: python3 -m build

      - name: Store distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions-${{ matrix.os }}
          path: dist/

  publish-to-pypi:
    name: Publish Python 🐍 distribution 📦 to PyPI
    needs:
      - check-tag
      - build
    if: needs.check-tag.outputs.publish == 'true'
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/joke-api-fetcher

    permissions:
      id-token: write

    steps:
      - name: Download all distributions
        uses: actions/download-artifact@v5
        with:
          pattern: python-package-distributions-*
          path: dist/
          merge-multiple: true

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
